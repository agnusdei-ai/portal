name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    # The bookmark RLS test runs the real migrations against a real Postgres
    # and speaks as the `authenticated` role — it needs a live server, not a
    # mock, because the invariant it checks lives in the policies.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # npm test runs `tsx --test tests/*.test.mjs`: the tests import the
          # TypeScript sources directly (fixture-driven logic tests), which no
          # Node version resolves without a loader. Any recent Node works; 22
          # is what the suite is run against.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run typecheck && npm test && npm run build
