name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  quality-gate:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # npm test runs `tsx --test tests/*.test.mjs`: the tests import the
          # TypeScript sources directly (fixture-driven logic tests), which no
          # Node version resolves without a loader. Any recent Node works; 22
          # is what the suite is run against.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run typecheck && npm test && npm run build
